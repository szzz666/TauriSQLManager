name: Android Smoke Test

# 在真实 Android 模拟器上安装 APK 并启动，抓取 logcat 与截图。
# 用途：图标 / 状态栏这类原生层改动无法靠「CI 构建通过」验证。
# v1.0.8 构建全绿但装上后崩溃/图标不对，就是这么漏掉的。

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-smoke.yml"
      - "scripts/android-smoke.sh"
  workflow_dispatch:
    inputs:
      tag:
        description: "要测试的 Release tag"
        required: true
        default: v1.0.8

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke API ${{ matrix.api }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    steps:
      - uses: actions/checkout@v4

      - name: 下载待测 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${TAG_INPUT:-v1.0.8}"
          echo "测试 $TAG 的 APK"
          mkdir -p apk
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "*-installable.apk" --dir apk --clobber
          ls -lh apk/

      - name: 启用 KVM
        run: |
          echo "KVM: $(ls -l /dev/kvm 2>/dev/null || echo none)"
          sudo chmod 666 /dev/kvm 2>/dev/null || true

      - name: 模拟器启动并安装运行
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-smoke.sh

      - name: 上传 logcat 与截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-api${{ matrix.api }}
          path: |
            logcat.txt
            screen-*.png
          if-no-files-found: warn
          retention-days: 7
