name: Mobile Build

# Android / iOS 构建
# 说明：Tauri 移动端必须在 macOS runner 上构建 iOS，在 Linux/macOS 上构建 Android。
# 移动端签名需额外配置，未配置时产出的是未签名包（仅用于测试）。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台"
        required: true
        default: both
        type: choice
        options: [both, android, ios]

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------------
  # Android：产出 APK（调试签名）与 AAB（上架 Google Play 用）
  # ------------------------------------------------------------------
  android:
    name: Android
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev build-essential

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runner 已预装 Android SDK，无需 setup-android action
      # （该 action 需要联网下载 cmdline-tools，在部分网络环境下会失败）
      - name: 配置 Android SDK 与 NDK
        run: |
          set -euo pipefail
          # runner 预装的 SDK 路径
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            # 兼容旧目录名
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi
          echo "sdkmanager: $SDKMANAGER"
          ls "$ANDROID_HOME" || true

          # 只安装缺失的组件，已存在则跳过（幂等，减少下载）
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

          # NDK：优先用已装版本，否则安装固定版本
          NDK_DIR="$ANDROID_HOME/ndk"
          mkdir -p "$NDK_DIR"
          if [ -z "$(ls -A "$NDK_DIR" 2>/dev/null)" ]; then
            "$SDKMANAGER" --install "ndk;26.1.10909125"
            NDK_VERSION="26.1.10909125"
          else
            NDK_VERSION="$(ls "$NDK_DIR" | head -1)"
            echo "复用已安装 NDK: $NDK_VERSION"
          fi
          echo "NDK_HOME=$NDK_DIR/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "最终 NDK: $NDK_DIR/$NDK_VERSION"
          ls "$NDK_DIR/$NDK_VERSION" | head -5

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安装 Rust 与 Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 缓存 Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: 安装前端依赖
        run: npm ci

      # gen/android 不入库，由 CI 按官方模板生成，避免提交大量模板文件
      - name: 初始化 Android 工程
        run: npx tauri android init --ci

      # release 变体需要显式签名配置，否则 Tauri 产出的是
      # app-universal-release-unsigned.apk —— Android 系统会拒绝安装。
      # 因此额外构建 debug 变体：Gradle 会用内置的 debug.keystore 自动签名，
      # 产物可直接安装（调试签名，仅适合测试分发，不可上架）。
      - name: 生成调试签名密钥库
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "调试密钥库就绪: $HOME/.android/debug.keystore"

      - name: 构建 release APK 与 AAB
        run: npx tauri android build --apk --aab --ci

      - name: 构建 debug APK（可直接安装）
        run: npx tauri android build --apk --debug --ci

      - name: 收集并重命名产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-artifacts
          OUT="src-tauri/gen/android/app/build/outputs"

          # ---- 可直接安装的 APK（debug 签名）----
          # 路径形如: apk/universal/debug/app-universal-debug.apk
          DEBUG_APK=$(find "$OUT" -type f -name "*.apk" -path "*/debug/*" | head -1 || true)
          if [ -n "$DEBUG_APK" ]; then
            cp -v "$DEBUG_APK" "dist-artifacts/TauriSQLManager_$(git describe --tags --always 2>/dev/null || echo dev)-installable.apk"
          fi

          # ---- release APK（未签名，若已配置签名则可用）----
          RELEASE_APK=$(find "$OUT" -type f -name "*.apk" -path "*/release/*" | head -1 || true)
          if [ -n "$RELEASE_APK" ]; then
            cp -v "$RELEASE_APK" "dist-artifacts/TauriSQLManager_$(git describe --tags --always 2>/dev/null || echo dev)-release-unsigned.apk"
          fi

          # ---- AAB（上架 Google Play 用，排除中间产物）----
          find "$OUT" -type f -name "*.aab" ! -name "intermediary-*" \
            -exec cp -v {} dist-artifacts/ \; 2>/dev/null || true

          echo "--- 产物清单 ---"
          ls -lh dist-artifacts/ || true

          # 必须至少有一个可安装的 APK，否则本次构建对用户无价值
          if ! ls dist-artifacts/*.apk >/dev/null 2>&1; then
            echo "::error::未生成任何 APK"
            find "$OUT" -name "*.apk" 2>/dev/null | head -10
            exit 1
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: TauriSQLManager-android
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------
  # iOS：产出未签名 .ipa（需自备证书才能真机安装）
  # ------------------------------------------------------------------
  ios:
    name: iOS
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安装 Rust 与 iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          # 真机用 aarch64-apple-ios；模拟器用 aarch64-apple-ios-sim（Apple Silicon Mac）
          # 不装 x86_64-apple-ios，避免 Intel 模拟器支持带来的额外体积和下载时间
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: 缓存 Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios

      - name: 安装前端依赖
        run: npm ci

      - name: 初始化 iOS 工程
        run: npx tauri ios init --ci

      # 未配置签名证书时无法产出可安装的 ipa。
      # 这里分两步：先尝试无签名构建（验证代码可编译），
      # 编译失败要让 CI 变红（不能掩盖真实错误），仅签名失败可容忍。
      - name: 编译 iOS（无签名）
        id: ios_build
        run: |
          set +e
          npx tauri ios build --ci --no-sign 2>&1 | tee /tmp/ios_build.log
          RC=${PIPESTATUS[0]}
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"

          # 区分「编译失败」和「仅签名失败」：签名相关错误可以放行
          SIGNISH=0
          grep -qiE 'requires a development team|no signing certificate|CodeSign .* failed|provisioning profile' /tmp/ios_build.log && SIGNISH=1

          if [ $RC -ne 0 ]; then
            if [ $SIGNISH -eq 1 ]; then
              echo "::warning::iOS 构建仅因缺少签名证书失败，产物不可安装到真机"
              echo "signed_only_failure=1" >> "$GITHUB_OUTPUT"
            else
              echo "::error::iOS 编译失败（非签名原因），请查看上方日志"
              tail -40 /tmp/ios_build.log
              exit 1
            fi
          else
            echo "signed_only_failure=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 收集 iOS 产物
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # 优先收集 ipa
          find src-tauri/gen/apple -type f -name "*.ipa" -exec cp -v {} dist-artifacts/ \; 2>/dev/null || true
          if ! ls dist-artifacts/* >/dev/null 2>&1; then
            echo "未生成 ipa（缺少 iOS 签名证书，属预期情况）。"
            echo "如需真机安装，请配置 APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY 等 Secrets，"
            echo "并把上面步骤的 --no-sign 去掉。"
          fi
          ls -lh dist-artifacts/ || true

      - name: 上传 iOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: TauriSQLManager-ios
          path: dist-artifacts/*
          if-no-files-found: warn
          retention-days: 30
  # ------------------------------------------------------------------
  # 打 tag 时把移动端产物附加到已有的 Release
  # 说明：Release 由 build.yml 创建（它负责桌面端），这里只补充移动端文件。
  # 因此不删改 Release，仅上传 assets。
  # ------------------------------------------------------------------
  attach-release:
    name: Attach to Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 下载移动端产物
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: 列出待上传文件
        run: ls -lh release-files/ || true

      - name: 等待 Release 就绪并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          echo "目标 Release: $TAG"

          # build.yml 也在同一 tag 上创建 Release，这里轮询等待其出现
          for i in $(seq 1 60); do
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release 已就绪"
              break
            fi
            echo "[$i] Release 尚未创建，等待 20s..."
            sleep 20
          done

          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || { echo "::error::Release $TAG 未在预期时间内创建"; exit 1; }

          # 先清理旧的 Android 产物（避免残留 unsigned APK 混淆用户）
          ASSETS=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq ".assets[].name" 2>/dev/null || true)
          for OLD in app-universal-release-unsigned.apk app-universal-release.aab intermediary-bundle.aab app-universal-debug.apk; do
            if echo "$ASSETS" | grep -qx "$OLD"; then
              echo "删除旧文件: $OLD"
              gh release delete-asset "$TAG" "$OLD" -y --repo "${{ github.repository }}" 2>/dev/null || true
            fi
          done

          # 上传移动端产物（--clobber 允许覆盖同名文件）
          shopt -s nullglob
          FILES=(release-files/*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::warning::没有移动端产物可上传"
            exit 0
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber --repo "${{ github.repository }}"
          echo "✅ 已上传 ${#FILES[@]} 个移动端产物"

          echo "--- Release 现有资产 ---"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq ".assets[] | .name + \"  \" + (.size|tostring)"