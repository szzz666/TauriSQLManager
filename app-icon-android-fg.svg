<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0EFFE"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7DFFB"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF6FF"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0B1F3A" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Android 自适应图标前景：仅图形（透明背景）。
       Android 会把前景缩到约 66% 安全区内再裁切，
       因此图形本身控制在画布中心约 62% 范围内，并带上闪电徽章。 -->
  <g transform="translate(512 512)">
    <g transform="translate(0 16) scale(0.96)" filter="url(#ds)">
      <!-- 底层 -->
      <g transform="translate(0 168)">
        <path d="M-206 0 C-206 -41 -92 -74 0 -74 C92 -74 206 -41 206 0 L206 54 C206 95 92 128 0 128 C-92 128 -206 95 -206 54 Z" fill="url(#side)"/>
        <ellipse cx="0" cy="0" rx="206" ry="74" fill="url(#topFace)"/>
      </g>
      <!-- 中层 -->
      <g transform="translate(0 44)">
        <path d="M-206 0 C-206 -41 -92 -74 0 -74 C92 -74 206 -41 206 0 L206 54 C206 95 92 128 0 128 C-92 128 -206 95 -206 54 Z" fill="url(#side)"/>
        <ellipse cx="0" cy="0" rx="206" ry="74" fill="url(#topFace)"/>
      </g>
      <!-- 顶层 -->
      <g transform="translate(0 -80)">
        <path d="M-206 0 C-206 -41 -92 -74 0 -74 C92 -74 206 -41 206 0 L206 54 C206 95 92 128 0 128 C-92 128 -206 95 -206 54 Z" fill="url(#side)"/>
        <ellipse cx="0" cy="0" rx="206" ry="74" fill="url(#topFace)"/>
        <ellipse cx="0" cy="0" rx="138" ry="47" fill="none" stroke="#BFDBFE" stroke-width="4" opacity="0.85"/>
        <ellipse cx="-54" cy="-18" rx="60" ry="20" fill="#FFFFFF" opacity="0.85"/>
      </g>
    </g>

    <!-- 闪电徽章（右下，保持与桌面图标一致） -->
    <g transform="translate(228 232)">
      <circle cx="0" cy="0" r="112" fill="#0B1F3A" opacity="0.20"/>
      <circle cx="0" cy="0" r="98" fill="url(#bolt)"/>
      <path d="M13 -50 L-28 8 L-4 8 L-15 54 L30 -8 L4 -8 Z" fill="#1E3A8A"/>
    </g>
  </g>
</svg>