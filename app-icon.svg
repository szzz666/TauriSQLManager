<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0EFFE"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7DFFB"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF6FF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0B1F3A" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="40" y="40" width="944" height="944" rx="212" fill="url(#bg)"/>
  <rect x="40" y="40" width="944" height="500" rx="212" fill="url(#gloss)"/>

  <!-- 数据库堆叠（整体放大、居中偏上） -->
  <g transform="translate(512 470) scale(1.16)" filter="url(#ds)">
    <!-- 最底层 -->
    <g transform="translate(0 176)">
      <path d="M-224 0 C-224 -44 -100 -80 0 -80 C100 -80 224 -44 224 0 L224 58 C224 102 100 138 0 138 C-100 138 -224 102 -224 58 Z" fill="url(#side)"/>
      <ellipse cx="0" cy="0" rx="224" ry="80" fill="url(#topFace)"/>
    </g>
    <!-- 中间层 -->
    <g transform="translate(0 44)">
      <path d="M-224 0 C-224 -44 -100 -80 0 -80 C100 -80 224 -44 224 0 L224 58 C224 102 100 138 0 138 C-100 138 -224 102 -224 58 Z" fill="url(#side)"/>
      <ellipse cx="0" cy="0" rx="224" ry="80" fill="url(#topFace)"/>
    </g>
    <!-- 顶层 -->
    <g transform="translate(0 -88)">
      <path d="M-224 0 C-224 -44 -100 -80 0 -80 C100 -80 224 -44 224 0 L224 58 C224 102 100 138 0 138 C-100 138 -224 102 -224 58 Z" fill="url(#side)"/>
      <ellipse cx="0" cy="0" rx="224" ry="80" fill="url(#topFace)"/>
      <!-- 顶面内圈装饰环 -->
      <ellipse cx="0" cy="0" rx="150" ry="52" fill="none" stroke="#BFDBFE" stroke-width="5" opacity="0.85"/>
      <ellipse cx="-58" cy="-20" rx="66" ry="22" fill="#FFFFFF" opacity="0.85"/>
    </g>
  </g>

  <!-- 右下角闪电徽章（独立、不遮挡主体） -->
  <g transform="translate(792 792)">
    <circle cx="0" cy="0" r="118" fill="#0B1F3A" opacity="0.22"/>
    <circle cx="0" cy="0" r="104" fill="url(#bolt)"/>
    <path d="M14 -54 L-30 8 L-4 8 L-16 58 L32 -8 L4 -8 Z" fill="#1E3A8A"/>
  </g>
</svg>