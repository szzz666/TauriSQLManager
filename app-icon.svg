<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="52%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="discSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="discTop" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- 数据库主体：略偏左，给右侧闪电留位 -->
  <g transform="translate(468 500) scale(0.94)">
    <g>
      <path d="M-232 -140 C-232 -183 -108 -214 0 -214 C108 -214 232 -183 232 -140 L232 -58 C232 -15 108 16 0 16 C-108 16 -232 -15 -232 -58 Z"
            fill="url(#discSide)" stroke="#1E3A8A" stroke-width="10" stroke-opacity="0.20"/>
      <ellipse cx="0" cy="-140" rx="232" ry="74" fill="url(#discTop)" stroke="#1E3A8A" stroke-width="10" stroke-opacity="0.20"/>
    </g>
    <g transform="translate(0 148)">
      <path d="M-232 -140 C-232 -183 -108 -214 0 -214 C108 -214 232 -183 232 -140 L232 -58 C232 -15 108 16 0 16 C-108 16 -232 -15 -232 -58 Z"
            fill="url(#discSide)" stroke="#1E3A8A" stroke-width="10" stroke-opacity="0.20"/>
      <ellipse cx="0" cy="-140" rx="232" ry="74" fill="url(#discTop)" stroke="#1E3A8A" stroke-width="10" stroke-opacity="0.20"/>
    </g>
    <g transform="translate(0 296)">
      <path d="M-232 -140 C-232 -183 -108 -214 0 -214 C108 -214 232 -183 232 -140 L232 -58 C232 -15 108 16 0 16 C-108 16 -232 -15 -232 -58 Z"
            fill="url(#discSide)" stroke="#1E3A8A" stroke-width="10" stroke-opacity="0.20"/>
      <ellipse cx="0" cy="-140" rx="232" ry="74" fill="url(#discTop)" stroke="#1E3A8A" stroke-width="10" stroke-opacity="0.20"/>
    </g>
  </g>

  <!-- 右侧闪电：从数据库穿出，象征查询 -->
  <g transform="translate(742 470)">
    <circle cx="0" cy="0" r="128" fill="#0B1F3A" opacity="0.18"/>
    <circle cx="0" cy="0" r="112" fill="url(#bolt)"/>
    <path d="M16 -60 L-34 12 L-4 12 L-18 62 L34 -10 L2 -10 Z" fill="#1E3A8A"/>
  </g>
</svg>